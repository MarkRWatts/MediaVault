# VM deployment overlay — used via:
#   docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# `app` joins the shared `edge` Docker network (external, created once on the
# VM — see the ~/edge stack, documented in DEPLOYMENT.md) instead of
# publishing a host port directly. A single shared Caddy instance there
# reverse-proxies to `app` by its `filmdb` alias on that network, and
# to any other app on the same VM by its own alias — one Caddy instance is
# how you serve multiple HTTPS domains from one host, since only one process
# can bind ports 443/80. Deliberately not merged into the base
# docker-compose.yml, which the Mac's local/dev setup also uses with no
# proxy at all (see docker-compose.override.yml).
services:
  app:
    networks:
      default: {}
      edge:
        aliases:
          - filmdb
    # The VM has no host-level SMB mount (deploy has no sudo, by design).
    # Instead the Docker daemon itself mounts the NAS share as a CIFS
    # named volume — a read-only, purpose-made SMB account, credentials in
    # .env.docker. The base compose's /movies bind still applies but points at
    # an empty placeholder dir on the VM (MOVIES_HOST_PATH in .env.docker);
    # MOVIES_PATH is overridden to look inside this volume instead. The same
    # "media" share also holds the TV Shows and Music folders, so TVSHOWS_PATH
    # and MUSIC_PATH are overridden the same way — no separate volume needed.
    environment:
      MOVIES_PATH: /media-share/Movies
      TVSHOWS_PATH: /media-share/TV Shows
      MUSIC_PATH: /media-share/Music
    volumes:
      - movies:/media-share:ro

volumes:
  movies:
    driver: local
    driver_opts:
      type: cifs
      device: //${MOVIES_SMB_HOST:?set MOVIES_SMB_HOST in .env.docker}/${MOVIES_SMB_SHARE:-media}
      o: "addr=${MOVIES_SMB_HOST},username=${MOVIES_SMB_USERNAME:?set MOVIES_SMB_USERNAME},password=${MOVIES_SMB_PASSWORD:?set MOVIES_SMB_PASSWORD},ro,vers=3.1.1,iocharset=utf8"

networks:
  edge:
    external: true
