name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      # tsc relies on the LayoutProps/PageProps helper types that Next.js
      # writes to .next/types — `next dev`/`next build` generate them as a
      # side effect, but CI never runs those, so typecheck needs this first.
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
