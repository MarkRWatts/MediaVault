services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # SQLite database and poster cache live in the named volume.
      DATABASE_URL: file:/app/data/mediavault.db
      POSTER_CACHE_DIR: /app/data/posters
      VIDEO_CACHE_DIR: /app/data/video-cache
      # Cap on that cache's total size in bytes (oldest-played evicted first).
      # Defaults to 10 GiB in code if left unset.
      VIDEO_CACHE_MAX_BYTES: ${VIDEO_CACHE_MAX_BYTES:-}
      # Root of the movie share (bind-mounted read-only from the host).
      MOVIES_PATH: /movies
      # Root of the TV share. No bind mount in this base compose file (that's
      # the prod overlay's job, via the same /media-share volume as movies) —
      # plain passthrough, empty by default, which skips the TV scan/enrich/
      # Jellyfin-TV-match phases entirely.
      TVSHOWS_PATH: ${TVSHOWS_PATH:-}
      # Root of the Music share. No bind mount in this base compose file (that's
      # the prod overlay's job, via the same /media-share volume as movies) —
      # plain passthrough, empty by default, which skips the music scan/enrich
      # phases entirely.
      MUSIC_PATH: ${MUSIC_PATH:-}
      # TMDB API key (optional, free) — enables posters, metadata, and
      # collection/missing-film detection. Leave blank to scan-only.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Jellyfin integration (optional) — enables "Play in Jellyfin" links and
      # a post-scan library sync. Leave blank to disable.
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_MOVIES_PREFIX: ${JELLYFIN_MOVIES_PREFIX:-/media/Movies/}
      JELLYFIN_TV_PREFIX: ${JELLYFIN_TV_PREFIX:-/media/TV Shows/}
      # BetterAuth (see HOUSEHOLDS_PLAN.md) — session/cookie signing key.
      # Generate with `npx @better-auth/cli secret`; set in .env.docker on
      # the VM, never committed.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # BetterAuth's own base URL, for building callback/redirect URLs.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      # Resend API key — sends the email-OTP sign-in codes (see
      # HOUSEHOLDS_PLAN.md and src/lib/email.ts). Domain-verified for
      # markrwatts.com. Leave blank to disable OTP email sending.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      # SQLite database and cached posters.
      - data:/app/data
      # Movie share (SMB mount on the host). On the Mac: /Volumes/media/Movies.
      # On the VM: an empty placeholder dir (the CIFS volume supplies the media).
      - ${MOVIES_HOST_PATH:-/Volumes/media/Movies}:/movies:ro

volumes:
  # Explicit name so the volume survives directory/project renames — Compose
  # otherwise derives the volume name from the project dir, which would
  # orphan existing data on a rename (see DEPLOYMENT.md's migration note).
  data:
    name: mediavault_data
